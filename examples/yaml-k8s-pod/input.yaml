apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          image: nginx:1.14.2
          env:
            - name: PORT
              value: '8080'
            - name: NODE_ENV
              value: 'production'
        - name: sidecar
          image: busybox
          env:
            - name: LOG_LEVEL
              value: 'debug'
